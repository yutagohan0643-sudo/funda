name: 信用残の更新

on:
  schedule:
    # JPX の公表（毎営業日16時ごろ）の後、平日 17:30 と 19:17（日本時間）に実行
    - cron: "30 8 * * 1-5"
    - cron: "17 10 * * 1-5"
  workflow_dispatch: # GitHub の画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: margin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 日本語フォントを入れる（グラフ用）
        run: sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: 信用残を取り込んでレポートを更新
        run: python -m margin_tracker
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margin data/fundamentals data/market_margin.csv margin
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "信用残を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
